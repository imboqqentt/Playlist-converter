name: Construir .exe para Windows

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Construir PlaylistConverter.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PlaylistConverter
          --icon playlist_converter/assets/icon.ico
          --add-data "playlist_converter/assets:playlist_converter/assets"
          --collect-data ytmusicapi --copy-metadata ytmusicapi
          --collect-data sv_ttk
          launcher.py

      - name: Probar el .exe
        shell: pwsh
        env:
          PLAYLIST_CONVERTER_HOME: ${{ runner.temp }}\pc-home
        # Es una app de ventana: hay que esperar a que termine para leer su código de salida.
        run: |
          foreach ($cmd in @("selftest", "accounts")) {
            $p = Start-Process .\dist\PlaylistConverter.exe -ArgumentList $cmd -Wait -PassThru
            Write-Host "$cmd -> $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistConverter-windows
          path: dist/PlaylistConverter.exe

      - name: Adjuntar a la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/PlaylistConverter.exe --clobber
